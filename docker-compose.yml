services:
  chatgpt-session-forge:
    build: .
    image: chatgpt-session-forge:latest
    container_name: chatgpt-session-forge
    restart: unless-stopped
    ports:
      - "0.0.0.0:16010:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_FILE: /app/data/accounts.json
      CONCURRENCY: ${CONCURRENCY:-8}
      OUTBOUND_PROXY: ${OUTBOUND_PROXY:-auto}
      BASIC_AUTH_USERNAME: ${BASIC_AUTH_USERNAME:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
      CSRF_ORIGIN_CHECK: ${CSRF_ORIGIN_CHECK:-true}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
